        // Initialize LocalStorage Database Layer
        function loadDB() {
            const stored = localStorage.getItem('SIMAG_SAWIT_DB_V2');
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch(e) {
                    console.error("Failed to parse DB, fallback to seed", e);
                }
            }
            localStorage.setItem('SIMAG_SAWIT_DB_V2', JSON.stringify(INITIAL_DB));
            return JSON.parse(JSON.stringify(INITIAL_DB));
        }

        function saveDB() {
            localStorage.setItem('SIMAG_SAWIT_DB_V2', JSON.stringify(DB));
        }

        let activePage = 'dashboard';
        let sidebarOpen = true;
        let activeModal = null;
        let modalData = null;

        // Filters State
        let productSearch = '';
        let productCatFilter = '';
        let productStatusFilter = '';
        let currentPageIndex = 1;
        const itemsPerPage = 8;

        // Audit Logging Helper
        function logActivity(module, action, dataId = '') {
            const newLog = {
                id: 'log-' + Date.now(),
                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
                user: currentUser.name,
                role: getRoleTitle(currentUser.role),
                module: module,
                action: action,
                dataId: dataId,
                ip: '192.168.1.' + Math.floor(Math.random() * 80 + 10)
            };
            DB.activity_logs.unshift(newLog);
            saveDB();
        }

        // Notification Helper
        function addNotification(type, title, message) {
            const newNotif = {
                id: 'nt-' + Date.now(),
                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16),
                type: type,
                title: title,
                message: message,
                read: false
            };
            DB.notifications.unshift(newNotif);
            saveDB();
            showToast(title + ': ' + message, type);
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-palm-700 text-white' : (type === 'danger' ? 'bg-red-600 text-white' : (type === 'warning' ? 'bg-amber-500 text-white' : 'bg-slate-800 text-white'));
            const iconName = type === 'success' ? 'check-circle' : (type === 'danger' ? 'alert-triangle' : (type === 'warning' ? 'alert-circle' : 'info'));
            
            toast.className = `flex items-center space-x-3 px-4 py-3 rounded-lg shadow-xl text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${bgClass}`;
            toast.innerHTML = `
                <i data-lucide="${iconName}" class="w-5 h-5 flex-shrink-0"></i>
                <span>${msg}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Helpers
        function formatNumber(num) {
            return new Intl.NumberFormat('id-ID').format(num || 0);
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
        }

        function getRoleTitle(roleKey) {
            const rolesMap = {
                'admin': 'Administrator Sistem',
                'kepala_gudang': 'Kepala Gudang',
                'petugas_gudang': 'Petugas Gudang',
                'manager': 'Manager Kebun',
                'pemohon': 'Pemohon (Afdeling)',
                'viewer': 'Viewer / Auditor'
            };
            return rolesMap[roleKey] || roleKey;
        }

        function getStockStatusBadge(product) {
            if (product.stock === 0) {
                return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800 border border-red-200">
                    <span class="w-1.5 h-1.5 rounded-full bg-red-600 mr-1.5"></span>HABIS
                </span>`;
            } else if (product.stock <= product.minStock) {
                return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-600 mr-1.5"></span>MENIPIS
                </span>`;
            } else {
                return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-palm-100 text-palm-800 border border-palm-200">
                    <span class="w-1.5 h-1.5 rounded-full bg-palm-600 mr-1.5"></span>AMAN
                </span>`;
            }
        }

        function updateProductStatus(product) {
            if (product.stock === 0) product.status = 'Habis';
            else if (product.stock <= product.minStock) product.status = 'Menipis';
            else product.status = 'Aman';
        }

        // Auto-generate Code Helpers
        function generateCode(prefix, listKey) {
            const count = (DB[listKey] ? DB[listKey].length : 0) + 1;
            const padded = String(count).padStart(3, '0');
            return `${prefix}-${padded}`;
        }

        function generateTxNo(prefix) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const rand = String(Math.floor(Math.random() * 9000 + 1000));
            return `${prefix}-${yyyy}${mm}${dd}-${rand}`;
        }

        // RBAC Permissions Check
        function hasPermission(action) {
            const role = currentUser.role;
            if (role === 'admin') return true;
            
            if (role === 'kepala_gudang') {
                return ['view_all', 'manage_products', 'manage_categories', 'manage_suppliers', 'manage_afdelings', 'manage_locations', 'goods_in', 'goods_out', 'approve_requests', 'opname', 'returns', 'reports'].includes(action);
            }
            if (role === 'petugas_gudang') {
                return ['view_stock', 'goods_in', 'goods_out', 'opname_draft', 'view_mutasi'].includes(action);
            }
            if (role === 'manager') {
                return ['view_all', 'approve_requests', 'reports', 'view_audit'].includes(action);
            }
            if (role === 'pemohon') {
                return ['create_request', 'view_requests', 'view_stock'].includes(action);
            }
            if (role === 'viewer') {
                return ['view_all', 'reports'].includes(action);
            }
            return false;
        }

        function handleSaveProduct(e, id) {

            const catId = document.getElementById('p-category').value;
            const brand = document.getElementById('p-brand').value;

            const minStock = parseFloat(document.getElementById('p-minstock').value) || 0;
            const locationId = document.getElementById('p-location').value;
            const price = parseFloat(document.getElementById('p-price').value) || 0;
            const notes = document.getElementById('p-notes').value;

            if (id) {
                const p = DB.products.find(item => item.id === id);
                if (p) {
                    p.name = name;
                    p.categoryId = catId;
                    p.brand = brand;
                    p.unit = unit;
                    p.minStock = minStock;
                    p.locationId = locationId;
                    p.price = price;
                    p.notes = notes;

                }
            } else {
                const stock = parseFloat(document.getElementById('p-stock').value) || 0;
                const newProduct = {
                    id: 'brg-' + Date.now(),
                    code: code,
                    name: name,
                    categoryId: catId,
                    brand: brand,
                    unit: unit,
                    stock: stock,
                    minStock: minStock,
                    locationId: locationId,
                    price: price,
                    notes: notes,
                    status: 'Aman'
                };
                updateProductStatus(newProduct);
                DB.products.unshift(newProduct);
                
                if (stock > 0) {
                    DB.stock_movements.unshift({
                        id: 'mov-' + Date.now(),
                        date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                        txNo: 'SALDO-AWAL-' + newProduct.code,
                        txType: 'SALDO_AWAL',
                        productId: newProduct.id,
                        qtyIn: stock,
                        qtyOut: 0,
                        balance: stock,
                        userId: currentUser.id,
                        notes: 'Saldo Awal Barang Baru'
                    });
                }

                logActivity('Data Barang', `Menambahkan barang baru ${code} - ${name}`);
                showToast('Barang baru berhasil ditambahkan!', 'success');
            }

            saveDB();
            closeModal();
        }

        // --- STOK OPNAME HANDLERS ---
        function updateOpnameSystemQty(prodId) {
            const prod = DB.products.find(p => p.id === prodId);
            const sysInput = document.getElementById('so-sysqty');
            if (sysInput) {
                sysInput.value = prod ? prod.stock : 0;
            }
            calculateOpnameDiff();
        }

        function calculateOpnameDiff() {
            const sysQty = parseFloat(document.getElementById('so-sysqty')?.value) || 0;
            const physQty = parseFloat(document.getElementById('so-physqty')?.value) || 0;
            const diff = physQty - sysQty;
            const diffEl = document.getElementById('so-diff');
            if (diffEl) {
                diffEl.textContent = (diff > 0 ? '+' : '') + formatNumber(diff);
                diffEl.className = 'font-extrabold ' + (diff < 0 ? 'text-rose-600' : (diff > 0 ? 'text-emerald-600' : 'text-slate-900'));
            }
        }

        function handleSaveOpname(e) {
            e.preventDefault();
            const no = document.getElementById('so-no').value;
            const date = document.getElementById('so-date').value;
            const prodId = document.getElementById('so-product').value;
            const sysQty = parseFloat(document.getElementById('so-sysqty').value) || 0;
            const physQty = parseFloat(document.getElementById('so-physqty').value) || 0;
            const notes = document.getElementById('so-notes').value;

            const diff = physQty - sysQty;

            const newOpname = {
                id: 'so-' + Date.now(),
                opnameNo: no,
                date: date,
                warehouseId: 'lok-1',
                userId: currentUser.id,
                notes: notes,
                status: 'Draft',
                items: [{ productId: prodId, systemQty: sysQty, physicalQty: physQty, difference: diff, notes: notes }]
            };

            DB.stock_opnames.unshift(newOpname);
            saveDB();
            logActivity('Stok Opname', `Input Opname ${no}`);
            showToast('Dokumen Stok Opname berhasil disimpan (Draft)!', 'success');
            closeModal();
        }

        function executeOpnameAdjustment(opnameId) {
            const so = DB.stock_opnames.find(s => s.id === opnameId);
            if (!so || !so.items || so.items.length === 0) return;

            const item = so.items[0];
            const prod = DB.products.find(p => p.id === item.productId);
            if (!prod) return;

            const diff = item.physicalQty - item.systemQty;

            if (confirm(`Konfirmasi penyesuaian stok ${prod.name} dari ${prod.stock} menjadi ${item.physicalQty} ${prod.unit}?`)) {
                prod.stock = item.physicalQty;
                updateProductStatus(prod);
                so.status = 'Disesuaikan';

                // Record adjustment movement in ledger
                DB.stock_movements.unshift({
                    id: 'mov-' + Date.now(),
                    date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                    txNo: so.opnameNo,
                    txType: 'OPNAME_ADJUST',
                    productId: prod.id,
                    qtyIn: diff > 0 ? diff : 0,
                    qtyOut: diff < 0 ? Math.abs(diff) : 0,
                    balance: prod.stock,
                    userId: currentUser.id,
                    notes: `Penyesuaian Stok Opname: ${so.notes}`
                });

                saveDB();
                logActivity('Stok Opname', `Eksekusi penyesuaian stok opname ${so.opnameNo} (${prod.name})`);
                showToast(`Stok ${prod.name} berhasil disesuaikan menjadi ${prod.stock} ${prod.unit}!`, 'success');
                renderApp();
            }
        }

        // --- RETUR HANDLERS ---
        function handleSaveReturn(e) {
            e.preventDefault();
            const no = document.getElementById('rt-no').value;
            const date = document.getElementById('rt-date').value;
            const type = document.getElementById('rt-type').value;
            const target = document.getElementById('rt-target').value;
            const prodId = document.getElementById('rt-product').value;
            const qty = parseFloat(document.getElementById('rt-qty').value) || 0;
            const reason = document.getElementById('rt-reason').value;

            const product = DB.products.find(p => p.id === prodId);
            if (!product) return;

            if (type === 'KE_SUPPLIER' && qty > product.stock) {
                alert(`GAGAL! Stok tidak mencukupi untuk retur ke supplier (${qty} > ${product.stock}).`);
                return;
            }

            if (type === 'KE_SUPPLIER') {
                product.stock -= qty;
            } else {
                product.stock += qty;
            }
            updateProductStatus(product);

            const newReturn = {
                id: 'rt-' + Date.now(),
                returnNo: no,
                date: date,
                returnType: type,
                targetName: target,
                productId: prodId,
                qty: qty,
                reason: reason,
                userId: currentUser.id
            };
            DB.returns.unshift(newReturn);

            DB.stock_movements.unshift({
                id: 'mov-' + Date.now(),
                date: date + ' ' + new Date().toTimeString().substring(0, 5),
                txNo: no,
                txType: type === 'KE_SUPPLIER' ? 'RETUR_SUPPLIER' : 'RETUR_AFDELING',
                productId: prodId,
                qtyIn: type === 'DARI_AFDELING' ? qty : 0,
                qtyOut: type === 'KE_SUPPLIER' ? qty : 0,
                balance: product.stock,
                userId: currentUser.id,
                notes: `Retur: ${reason}`
            });

            saveDB();
            logActivity('Retur Barang', `Transaksi Retur ${no} (${type})`);
            showToast(`Retur barang berhasil disimpan! Stok ${product.name} kini ${product.stock} ${product.unit}`, 'success');
            closeModal();
        }

        // --- GOODS IN HANDLERS ---
        function handleSaveGoodsIn(e) {
            e.preventDefault();
            const txNo = document.getElementById('gi-txno').value;
            const date = document.getElementById('gi-date').value;
            const supplierId = document.getElementById('gi-supplier').value;
            const sj = document.getElementById('gi-sj').value;
            const productId = document.getElementById('gi-product').value;
            const qty = parseFloat(document.getElementById('gi-qty').value) || 0;
            const notes = document.getElementById('gi-notes').value;

            const product = DB.products.find(p => p.id === productId);
            if (!product) return;

            const initialStock = product.stock;
            product.stock += qty;
            updateProductStatus(product);

            const newGR = {
                id: 'gr-' + Date.now(),
                txNo: txNo,
                date: date,
                supplierId: supplierId,
                suratJalan: sj,
                userId: currentUser.id,
                notes: notes,
                items: [{ productId: productId, qty: qty, unit: product.unit }]
            };
            DB.goods_receipts.unshift(newGR);

            DB.stock_movements.unshift({
                id: 'mov-' + Date.now(),
                date: date + ' ' + new Date().toTimeString().substring(0, 5),
                txNo: txNo,
                txType: 'BARANG_MASUK',
                productId: productId,
                qtyIn: qty,
                qtyOut: 0,
                balance: product.stock,
                userId: currentUser.id,
                notes: `Terima dari supplier (SJ: ${sj})`
            });

            saveDB();
            logActivity('Barang Masuk', `Penerimaan ${qty} ${product.unit} ${product.name} (${txNo})`);
            addNotification('success', 'Barang Masuk Berhasil', `Stok ${product.name} bertambah dari ${initialStock} menjadi ${product.stock} ${product.unit}`);
            closeModal();
        }

        // --- GOODS OUT HANDLERS ---
        function handleSaveGoodsOut(e) {
            e.preventDefault();
            const txNo = document.getElementById('go-txno').value;
            const date = document.getElementById('go-date').value;
            const afdelingId = document.getElementById('go-afdeling').value;
            const requester = document.getElementById('go-requester').value;
            const productId = document.getElementById('go-product').value;
            const qty = parseFloat(document.getElementById('go-qty').value) || 0;
            const reqNo = document.getElementById('go-reqno').value;

            const product = DB.products.find(p => p.id === productId);
            if (!product) return;

            if (qty > product.stock) {
                alert(`GAGAL! Jumlah barang keluar (${qty} ${product.unit}) melebihi stok yang tersedia (${product.stock} ${product.unit}).`);
                return;
            }

            const initialStock = product.stock;
            product.stock -= qty;
            updateProductStatus(product);

            const newGI = {
                id: 'gi-' + Date.now(),
                txNo: txNo,
                date: date,
                afdelingId: afdelingId,
                requester: requester,
                reqNo: reqNo,
                userId: currentUser.id,
                items: [{ productId: productId, qty: qty, unit: product.unit }]
            };
            DB.goods_issues.unshift(newGI);

            DB.stock_movements.unshift({
                id: 'mov-' + Date.now(),
                date: date + ' ' + new Date().toTimeString().substring(0, 5),
                txNo: txNo,
                txType: 'BARANG_KELUAR',
                productId: productId,
                qtyIn: 0,
                qtyOut: qty,
                balance: product.stock,
                userId: currentUser.id,
                notes: `Pengeluaran untuk ${requester}`
            });

            if (product.stock <= product.minStock) {
                addNotification('warning', 'Peringatan Stok Menipis', `Stok ${product.name} tersisa ${product.stock} ${product.unit} (di bawah minimum ${product.minStock})`);
            }

            saveDB();
            logActivity('Barang Keluar', `Pengeluaran ${qty} ${product.unit} ${product.name} (${txNo})`);
            showToast(`Barang Keluar Berhasil! Stok tersisa: ${product.stock} ${product.unit}`, 'success');
            closeModal();
        }

        // --- MATERIAL REQUEST HANDLERS ---
        function handleSaveMaterialRequest(e) {
            e.preventDefault();
            const reqNo = document.getElementById('mr-no').value;
            const afdelingId = document.getElementById('mr-afdeling').value;
            const requester = document.getElementById('mr-requester').value;
            const purpose = document.getElementById('mr-purpose').value;
            const productId = document.getElementById('mr-product').value;
            const qty = parseFloat(document.getElementById('mr-qty').value) || 0;

            const product = DB.products.find(p => p.id === productId);

            const newMR = {
                id: 'mr-' + Date.now(),
                reqNo: reqNo,
                date: new Date().toISOString().substring(0, 10),
                afdelingId: afdelingId,
                requester: requester,
                purpose: purpose,
                status: 'Menunggu',
                items: [{ productId: productId, qty: qty, unit: product ? product.unit : '' }]
            };
            DB.material_requests.unshift(newMR);
            saveDB();

            logActivity('Permintaan Barang', `Membuat permintaan baru ${reqNo}`);
            addNotification('info', 'Permintaan Baru Ditambahkan', `Permintaan ${reqNo} menunggu approval Manager.`);
            closeModal();
        }

        function approveRequest(id) {
            const mr = DB.material_requests.find(r => r.id === id);
            if (mr) {
                mr.status = 'Disetujui';
                mr.approvedBy = currentUser.name;
                saveDB();
                logActivity('Permintaan Barang', `Manager menyetujui permintaan ${mr.reqNo}`);
                showToast(`Permintaan ${mr.reqNo} disetujui!`, 'success');
                renderApp();
            }
        }

        function rejectRequest(id) {
            const mr = DB.material_requests.find(r => r.id === id);
            if (mr) {
                mr.status = 'Ditolak';
                saveDB();
                logActivity('Permintaan Barang', `Manager menolak permintaan ${mr.reqNo}`);
                showToast(`Permintaan ${mr.reqNo} ditolak`, 'danger');
                renderApp();
            }
        }

        function processRequestToGoodsOut(id) {
            const mr = DB.material_requests.find(r => r.id === id);
            if (!mr || !mr.items || mr.items.length === 0) return;

            const item = mr.items[0];
            const product = DB.products.find(p => p.id === item.productId);
            if (!product) return;

            if (item.qty > product.stock) {
                alert(`TIDAK DAPAT MEMPROSES: Stok ${product.name} tidak cukup (${product.stock} ${product.unit} tersedia, dibutuhkan ${item.qty}).`);
                return;
            }

            const txNo = generateTxNo('BK');
            product.stock -= item.qty;
            updateProductStatus(product);

            mr.status = 'Selesai';
            mr.notes = `Diterbitkan Barang Keluar ${txNo}`;

            DB.goods_issues.unshift({
                id: 'gi-' + Date.now(),
                txNo: txNo,
                date: new Date().toISOString().substring(0, 10),
                afdelingId: mr.afdelingId,
                requester: mr.requester,
                reqNo: mr.reqNo,
                userId: currentUser.id,
                items: mr.items
            });

            DB.stock_movements.unshift({
                id: 'mov-' + Date.now(),
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                txNo: txNo,
                txType: 'BARANG_KELUAR',
                productId: product.id,
                qtyIn: 0,
                qtyOut: item.qty,
                balance: product.stock,
                userId: currentUser.id,
                notes: `Proses Permintaan ${mr.reqNo}`
            });

            saveDB();
            logActivity('Permintaan Barang', `Memproses ${mr.reqNo} menjadi Barang Keluar ${txNo}`);
            showToast(`Permintaan ${mr.reqNo} selesai diproses! Stok terpotong.`, 'success');
            renderApp();
        }

        // EXPORT PDF & EXCEL REPORTS
        function exportProductsExcel() {
            const wsData = DB.products.map(p => {
                const cat = DB.categories.find(c => c.id === p.categoryId);
                const loc = DB.locations.find(l => l.id === p.locationId);
                return {
                    'Kode Barang': p.code,
                    'Nama Barang': p.name,
                    'Kategori': cat ? cat.name : '',
                    'Merk': p.brand || '',
                    'Satuan': p.unit,
                    'Stok Gudang': p.stock,
                    'Stok Minimum': p.minStock,
                    'Harga Satuan (Rp)': p.price,
                    'Lokasi': loc ? loc.warehouse : '',
                    'Status': p.status
                };
            });

            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Master Barang");
            XLSX.writeFile(wb, `Laporan_Stok_Gudang_Sawit_${new Date().toISOString().substring(0, 10)}.xlsx`);
            logActivity('Laporan', 'Export Master Data Barang ke Excel');
            showToast('File Excel berhasil dikirim ke download!', 'success');
        }

        function generatePDFReport(type) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(27, 67, 50);
            doc.rect(0, 0, 210, 28, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.setFont("helvetica", "bold");
            doc.text("SISTEM MANAJEMEN GUDANG PERKEBUNAN KELAPA SAWIT", 14, 15);
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("PT PERKEBUNAN SAWIT INDONESIA TBK. - LAPORAN RESMI PERSERUAN", 14, 22);

            doc.setTextColor(30, 41, 59);
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");

            if (type === 'stok') {
                doc.text("LAPORAN STOK PERSERIAAN GUDANG REAL-TIME", 14, 38);
                doc.setFontSize(9);
                doc.setFont("helvetica", "normal");
                doc.text(`Tanggal Cetak: ${new Date().toLocaleString('id-ID')} | Oleh: ${currentUser.name}`, 14, 44);

                const tableData = DB.products.map((p, i) => [
                    i + 1,
                    p.code,
                    p.name,
                    p.unit,
                    formatNumber(p.stock),
                    formatNumber(p.minStock),
                    formatRupiah(p.price),
                    p.status
                ]);

                doc.autoTable({
                    startY: 48,
                    head: [['No', 'Kode', 'Nama Barang', 'Satuan', 'Stok', 'Min', 'Harga', 'Status']],
                    body: tableData,
                    headStyles: { fillColor: [27, 67, 50] },
                    styles: { fontSize: 8 }
                });
            } else if (type === 'barang_masuk') {
                doc.text("LAPORAN TRANSAKSI BARANG MASUK", 14, 38);
                const tableData = DB.goods_receipts.map((gr, i) => {
                    const sup = DB.suppliers.find(s => s.id === gr.supplierId);
                    return [i + 1, gr.txNo, gr.date, sup ? sup.name : '', gr.suratJalan, gr.notes];
                });
                doc.autoTable({
                    startY: 48,
                    head: [['No', 'No Transaksi', 'Tanggal', 'Supplier', 'Surat Jalan', 'Catatan']],
                    body: tableData,
                    headStyles: { fillColor: [27, 67, 50] }
                });
            } else if (type === 'mutasi') {
                doc.text("LAPORAN LEDGER MUTASI STOK BARANG", 14, 38);
                const tableData = DB.stock_movements.map((m, i) => {
                    const prod = DB.products.find(p => p.id === m.productId);
                    return [i + 1, m.date, m.txNo, m.txType, prod ? prod.name : '', m.qtyIn, m.qtyOut, m.balance];
                });
                doc.autoTable({
                    startY: 48,
                    head: [['No', 'Tanggal', 'No Transaksi', 'Jenis', 'Barang', 'Masuk', 'Keluar', 'Saldo']],
                    body: tableData,
                    headStyles: { fillColor: [27, 67, 50] }
                });
            }

            doc.save(`Laporan_${type}_Sawit_${new Date().toISOString().substring(0, 10)}.pdf`);
            logActivity('Laporan', `Export Laporan PDF (${type})`);
            showToast('Laporan PDF berhasil di-generate & di-download!', 'success');
        }

        // INITIALIZE APP ON LOAD
        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
